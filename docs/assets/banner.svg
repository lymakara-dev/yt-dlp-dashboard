<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="yt-dlp Dashboard banner">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="#0B0E14"/>
  <rect width="1280" height="320" fill="url(#glowV)"/>
  <rect width="1280" height="320" fill="url(#glowC)"/>

  <!-- oversized watermark mark on the right -->
  <g transform="translate(940,60)" opacity="0.10">
    <rect x="82" y="24" width="28" height="76" rx="14" fill="url(#brand)"/>
    <path d="M44 92 H148 L96 164 Z" fill="url(#brand)"/>
  </g>

  <!-- mark -->
  <g transform="translate(96,108) scale(2.1)">
    <rect x="20.5" y="6" width="7" height="19" rx="3.5" fill="url(#brand)"/>
    <path d="M11 23 H37 L24 41 Z" fill="url(#brand)"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="208" y="158" font-size="56" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#F1F5F9">yt-dlp </tspan><tspan fill="url(#brand)">Dashboard</tspan>
    </text>
    <text x="210" y="196" font-size="23" font-weight="400" fill="#94A3B8">
      A self-hosted web dashboard for yt-dlp
    </text>
    <text x="210" y="228" font-size="18" font-weight="400" fill="#64748B">
      Probe, queue, and track downloads in real time.
    </text>
  </g>

  <!-- accent progress line -->
  <rect x="210" y="252" width="640" height="6" rx="3" fill="#1E2533"/>
  <rect x="210" y="252" width="430" height="6" rx="3" fill="url(#brand)"/>
</svg>
