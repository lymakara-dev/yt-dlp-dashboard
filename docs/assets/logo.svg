<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" role="img" aria-label="yt-dlp Dashboard">
  <defs>
    <linearGradient id="ytd-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(8,8)">
    <rect x="20.5" y="6" width="7" height="19" rx="3.5" fill="url(#ytd-brand)"/>
    <path d="M11 23 H37 L24 41 Z" fill="url(#ytd-brand)"/>
  </g>
  <!-- wordmark: slate reads on light + dark, violet accent reads on both -->
  <text x="68" y="40" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#64748B">yt-dlp </tspan><tspan fill="#7C5CFF">Dashboard</tspan>
  </text>
</svg>
