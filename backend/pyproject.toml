[project]
name = "yt-dlp-dashboard-backend"
version = "0.1.0"
description = "Self-hosted web dashboard for yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2025.1.15",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "mutagen>=1.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
