services:
  yt-dlp-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-dlp-dashboard:latest
    container_name: yt-dlp-dashboard
    ports:
      - "8001:8000"
    volumes:
      # Where your downloaded files land on the host.
      - ./downloads:/downloads
      # Persisted SQLite database (job history + settings) survives restarts.
      - ./data:/data
    environment:
      YTDLP_DOWNLOAD_DIR: /downloads
      YTDLP_DATABASE_URL: sqlite:////data/app.db
      # Set to a @BotFather token to enable the Telegram bot (then enable it
      # and allow your chat ID from Settings → Telegram Bot in the UI).
      # Value comes from the (gitignored) .env file next to this compose file.
      YTDLP_TELEGRAM_BOT_TOKEN: ${YTDLP_TELEGRAM_BOT_TOKEN:-}
    restart: unless-stopped
